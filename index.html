<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- KODE SEO E-TAHFIZ SMPN 4 MALANG -->
  <title>E-Tahfiz & Tilawah Mujawwad Al-Qur'an - SMP Negeri 4 Malang</title>
  <meta name="description" content="Portal resmi E-Tahfiz dan Tilawah Mujawwad Al-Qur'an SMP Negeri 4 Malang (Jl. Veteran No. 37). Sistem terintegrasi perekaman setoran Juz 30 & Juz 29, penilaian guru, dan pemantauan orang tua." />
  <meta name="keywords" content="E-Tahfiz SMPN 4 Malang, Tilawah Mujawwad SMPN 4 Malang, Setoran Hafalan SMP Negeri 4 Malang, Arspema" />
  <meta name="robots" content="index, follow" />

  <!-- Tailwind CSS & Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>

  <!-- Mesin React 18 & Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.454.0?external=react"
      }
    }
  </script>

  <!-- Penerjemah Otomatis File .TSX (Babel) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
  <div id="root"></div>

  <!-- Memuat & Menjalankan File .TSX secara Otomatis -->
  <script>
    fetch('./e_tahfiz_tilawah_smpn_4_malang.tsx')
      .then(res => res.text())
      .then(tsxCode => {
        // Ubah 'export default function App()' menjadi 'function App()' secara otomatis
        const modifiedCode = tsxCode.replace('export default function App()', 'function App()') +
          '\nimport { createRoot } from "react-dom/client";\ncreateRoot(document.getElementById("root")).render(<App />);';
        
        // Terjemahkan kode .TSX menjadi JavaScript yang dimengerti browser
        const compiled = Babel.transform(modifiedCode, {
          presets: ['react', 'typescript'],
          filename: 'app.tsx'
        }).code;

        // Jalankan aplikasinya
        const script = document.createElement('script');
        script.type = 'module';
        script.textContent = compiled;
        document.body.appendChild(script);
      });
  </script>
</body>
</html>
