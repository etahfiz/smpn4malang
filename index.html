<body class="bg-slate-50">
  <div id="root">
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;background:linear-gradient(135deg,#065f46,#115e59);color:#ffffff;font-family:'Inter',sans-serif;text-align:center;padding:20px;">
      <div style="width:56px;height:56px;border-radius:16px;background:#f59e0b;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px;box-shadow:0 10px 25px rgba(0,0,0,0.2);">🕌</div>
      <div style="font-size:20px;font-weight:800;margin-bottom:6px;">Memuat Database Cloud E-Tahfiz...</div>
      <div style="font-size:13px;color:#d1fae5;max-width:360px;">Menyinkronkan data murid, guru, dan rekaman terbaru dari server sekolah...</div>
    </div>
  </div>

  <script type="module">
    // =========================================================================
    // TEMPELKAN URL GOOGLE APPS SCRIPT (/exec) ANDA DI DALAM TANDA KUTIP DI BAWAH INI:
    // =========================================================================
    const MASTER_CLOUD_URL = "https://script.google.com/macros/s/AKfycbyfr3PuxU9uYMLJpk1wA8vX00BFJ6wcjso-HlTjwzly7juJ7V-j-sIYSdmYg-55p9lj/exec";

    // Fungsi pembersih URL Google Drive & ekstraktor File ID
    function cleanDriveLink(rawUrl, driveUrl, driveFileId) {
      let s = String(rawUrl || "").trim();
      s = s.replace(/\[https?:\/\/[^\]]+\]\((https?:\/\/[^\)]+)\)/g, "$1").replace(/^\[|\]$/g, "");
      if (s.startsWith("data:")) return s;

      const combined = s + " " + String(driveUrl || "") + " " + String(driveFileId || "");
      const m = combined.match(/(?:id=|\/d\/|^|\s)([a-zA-Z0-9_-]{25,})/);
      if (m && m[1]) {
        return "https://drive.google.com/uc?export=download&id=" + m[1];
      }
      return s;
    }

    // Cache audio di memori browser agar tidak perlu download ulang saat diputar ke-2 kalinya
    const driveAudioCache = new Map();

    function setupDriveAudioAutoLoader(gasWebhookUrl) {
      if (!gasWebhookUrl || !gasWebhookUrl.startsWith("http")) return;

      async function resolveAudioElement(audioEl) {
        if (!audioEl || audioEl.dataset.driveResolved === "true" || audioEl.dataset.driveLoading === "true") return;
        const src = audioEl.getAttribute("src") || audioEl.src || "";
        const match = src.match(/(?:id=|\/d\/)([a-zA-Z0-9_-]{25,})/);
        if (!match || !match[1]) return;

        const fileId = match[1];
        if (driveAudioCache.has(fileId)) {
          audioEl.dataset.driveResolved = "true";
          audioEl.src = driveAudioCache.get(fileId);
          return;
        }

        audioEl.dataset.driveLoading = "true";
        try {
          const res = await fetch(gasWebhookUrl + "?action=getAudio&id=" + encodeURIComponent(fileId));
          const data = await res.json();
          if (data && data.status === "ok" && data.dataUrl) {
            driveAudioCache.set(fileId, data.dataUrl);
            audioEl.dataset.driveResolved = "true";
            const wasPlaying = !audioEl.paused;
            audioEl.src = data.dataUrl;
            audioEl.load();
            if (wasPlaying) audioEl.play().catch(() => {});
          }
        } catch (err) {
          console.warn("Gagal memuat audio dari Drive:", err);
        } finally {
          audioEl.dataset.driveLoading = "false";
        }
      }

      // Pantau seluruh elemen <audio> yang muncul di layar secara otomatis
      const scanAllAudios = () => {
        document.querySelectorAll("audio").forEach(el => {
          const src = el.getAttribute("src") || el.src || "";
          if (src.includes("drive.google.com") || src.includes("docs.google.com")) {
            resolveAudioElement(el);
          }
        });
      };

      const observer = new MutationObserver(() => scanAllAudios());
      observer.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ["src"] });
      setInterval(scanAllAudios, 1500);
    }

    async function bootRealtimeApp() {
      try {
        let activeWebhook = MASTER_CLOUD_URL;
        try {
          const localCfg = JSON.parse(localStorage.getItem("ETAHFIZ_WHITELABEL_CONFIG_V1") || "{}");
          if ((!activeWebhook || activeWebhook === MASTER_CLOUD_URL) && localCfg.gasWebhookUrl && localCfg.gasWebhookUrl.startsWith("http") && !localCfg.gasWebhookUrl.includes("SMPN4MALANG_TAHFIZ_TILAWAH_WEBHOOK")) {
            activeWebhook = localCfg.gasWebhookUrl;
          }
        } catch (e) {}

        // Aktifkan jembatan pemutar audio Google Drive
        setupDriveAudioAutoLoader(activeWebhook);

        if (activeWebhook && activeWebhook.startsWith("http") && activeWebhook !== "TEMPEL_URL_GOOGLE_APPS_SCRIPT_ANDA_DI_SINI" && !activeWebhook.includes("SMPN4MALANG_TAHFIZ_TILAWAH_WEBHOOK")) {
          try {
            const cloudRes = await fetch(activeWebhook + "?t=" + Date.now());
            if (cloudRes.ok) {
              const cloudData = await cloudRes.json();
              if (cloudData.config && cloudData.config.schoolName) {
                if (!cloudData.config.gasWebhookUrl || cloudData.config.gasWebhookUrl.includes("SMPN4MALANG")) {
                  cloudData.config.gasWebhookUrl = activeWebhook;
                }
                localStorage.setItem("ETAHFIZ_WHITELABEL_CONFIG_V1", JSON.stringify(cloudData.config));
              }
              if (Array.isArray(cloudData.records) && cloudData.records.length > 0) {
                const sanitizedRecords = cloudData.records.map(r => ({
                  ...r,
                  audioUrl: cleanDriveLink(r.audioUrl, r.driveUrl, r.driveFileId)
                }));
                localStorage.setItem("ETAHFIZ_COMMERCIAL_RECORDS_V1", JSON.stringify(sanitizedRecords));
              }
            }
          } catch (cloudErr) {
            console.warn("Mode Offline / Lokal aktif:", cloudErr);
          }
        }

        const res = await fetch('./e_tahfiz_tilawah_smpn_4_malang.tsx');
        if (!res.ok) throw new Error('File .tsx tidak ditemukan (Status: ' + res.status + ')');
        let tsxCode = await res.text();

        if (activeWebhook && activeWebhook.startsWith("http") && activeWebhook !== "TEMPEL_URL_GOOGLE_APPS_SCRIPT_ANDA_DI_SINI") {
          tsxCode = tsxCode.replace(
            "https://script.google.com/macros/s/AKfycbz_SMPN4MALANG_TAHFIZ_TILAWAH_WEBHOOK/exec",
            activeWebhook
          );
        }

        // 1. PATCH SIMPAN ADMIN KE CLOUD
        const oldSaveAdmin = `  // Simpan semua perubahan ke state utama & localStorage
  const handleSaveAllChanges = () => {
    const activeCount = Object.values(draftConfig.enabledPages).filter(Boolean).length;
    if (activeCount === 0) {
      showToast("Aktifkan minimal 1 halaman menu agar aplikasi dapat digunakan!", "error");
      return;
    }
    setConfig(draftConfig);
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(draftConfig));
    showToast("Seluruh pengaturan White-Label berhasil diterapkan & disimpan ke localStorage!");
  };`;

        const newSaveAdmin = `  // Simpan semua perubahan ke state utama, localStorage & Cloud Spreadsheet
  const handleSaveAllChanges = () => {
    const activeCount = Object.values(draftConfig.enabledPages).filter(Boolean).length;
    if (activeCount === 0) {
      showToast("Aktifkan minimal 1 halaman menu agar aplikasi dapat digunakan!", "error");
      return;
    }
    setConfig(draftConfig);
    localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(draftConfig));
    if (typeof document !== 'undefined') {
      document.body.classList.toggle('hide-password-hints', Boolean(draftConfig.hidePasswordHints));
    }
    onSyncSpreadsheet(draftConfig);
  };`;

        tsxCode = tsxCode.replace(oldSaveAdmin, newSaveAdmin);

        // 2. PATCH CORS PENGIRIMAN CONFIG
        const oldSyncFunc = `      if (customConfig.gasWebhookUrl && customConfig.gasWebhookUrl.startsWith("http")) {
        fetch(customConfig.gasWebhookUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            action: "SAVE_WHITELABEL_CONFIG",
            timestamp: new Date().toISOString(),
            config: customConfig
          })
        }).catch(() => {});
      }`;

        const newSyncFunc = `      if (customConfig.gasWebhookUrl && customConfig.gasWebhookUrl.startsWith("http") && !customConfig.gasWebhookUrl.includes("SMPN4MALANG_TAHFIZ_TILAWAH_WEBHOOK")) {
        fetch(customConfig.gasWebhookUrl, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({
            action: "SAVE_WHITELABEL_CONFIG",
            timestamp: new Date().toISOString(),
            config: customConfig
          })
        }).catch(() => {});
      }`;

        tsxCode = tsxCode.replace(oldSyncFunc, newSyncFunc);

        // 3. PATCH PENGIRIMAN REKAMAN SUPER CEPAT & PEMBERSIH URL DRIVE
        const oldRecordsBlock = `  // State Data Rekaman
  const [records, setRecords] = useState(() => {
    const tahfizSampleAudio = generateSimulatedMurottalWav(5, 'tahfiz');
    const tilawahSampleAudio = generateSimulatedMurottalWav(6, 'tilawah');
    return INITIAL_RECORDS.map(rec => ({
      ...rec,
      audioUrl: rec.category === 'tilawah' ? tilawahSampleAudio : tahfizSampleAudio
    }));
  });`;

        const newRecordsBlock = `  // State Data Rekaman (Skala 1.000 Murid + Auto Clean Link Drive)
  const [records, setRecords] = useState(() => {
    const tahfizSampleAudio = generateSimulatedMurottalWav(5, 'tahfiz');
    const tilawahSampleAudio = generateSimulatedMurottalWav(6, 'tilawah');
    try {
      const savedRecs = localStorage.getItem("ETAHFIZ_COMMERCIAL_RECORDS_V1");
      if (savedRecs) {
        const parsed = JSON.parse(savedRecs);
        if (Array.isArray(parsed) && parsed.length > 0) {
          return parsed.map(rec => {
            let cleanUrl = String(rec.audioUrl || "").replace(/\\[https?:\\/\\/[^\\]]+\\]\\((https?:\\/\\/[^\\)]+)\\)/g, "$1").replace(/^\\[|\\]$/g, "");
            const idMatch = (cleanUrl + " " + String(rec.driveUrl || "") + " " + String(rec.driveFileId || "")).match(/(?:id=|\\/d\\/|\\b)([a-zA-Z0-9_-]{25,})/);
            if (!cleanUrl.startsWith("data:") && idMatch && idMatch[1]) {
              cleanUrl = "https://drive.google.com/uc?export=download&id=" + idMatch[1];
            }
            return {
              ...rec,
              audioUrl: (cleanUrl && (cleanUrl.startsWith('data:') || cleanUrl.startsWith('http'))) ? cleanUrl : (rec.category === 'tilawah' ? tilawahSampleAudio : tahfizSampleAudio)
            };
          });
        }
      }
    } catch (e) {}
    return INITIAL_RECORDS.map(rec => ({
      ...rec,
      audioUrl: rec.category === 'tilawah' ? tilawahSampleAudio : tahfizSampleAudio
    }));
  });

  const postToCloudFast = (payload, updatedList) => {
    try {
      const lightList = updatedList.slice(0, 150).map(r => ({
        ...r,
        audioUrl: (r.audioUrl && r.audioUrl.startsWith('http')) ? r.audioUrl : null
      }));
      localStorage.setItem("ETAHFIZ_COMMERCIAL_RECORDS_V1", JSON.stringify(lightList));
    } catch (e) {}
    if (config.gasWebhookUrl && config.gasWebhookUrl.startsWith("http") && !config.gasWebhookUrl.includes("SMPN4MALANG_TAHFIZ_TILAWAH_WEBHOOK")) {
      fetch(config.gasWebhookUrl, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      }).catch(() => {});
    }
  };`;

        tsxCode = tsxCode.replace(oldRecordsBlock, newRecordsBlock);

        tsxCode = tsxCode.replace(
          "setRecords(prev => [newRecord, ...prev]);",
          "setRecords(prev => { const next = [newRecord, ...prev]; postToCloudFast({ action: 'ADD_SINGLE_RECORD', record: newRecord }, next); return next; });"
        );
        tsxCode = tsxCode.replace(
          `  const handleTeacherSave = (recordId, grade, teacherComment, teacherName) => {
    setRecords(prev => prev.map(rec => {
      if (rec.id === recordId) {
        return { ...rec, grade, teacherComment, teacherName };
      }
      return rec;
    }));`,
          `  const handleTeacherSave = (recordId, grade, teacherComment, teacherName) => {
    setRecords(prev => {
      let targetRec = null;
      const next = prev.map(rec => {
        if (rec.id === recordId) {
          targetRec = { ...rec, grade, teacherComment, teacherName };
          return targetRec;
        }
        return rec;
      });
      if (targetRec) postToCloudFast({ action: 'UPDATE_SINGLE_RECORD', record: targetRec }, next);
      return next;
    });`
        );
        tsxCode = tsxCode.replace(
          `  const handleParentSave = (recordId, parentComment) => {
    setRecords(prev => prev.map(rec => {
      if (rec.id === recordId) {
        return { ...rec, parentComment };
      }
      return rec;
    }));`,
          `  const handleParentSave = (recordId, parentComment) => {
    setRecords(prev => {
      let targetRec = null;
      const next = prev.map(rec => {
        if (rec.id === recordId) {
          targetRec = { ...rec, parentComment };
          return targetRec;
        }
        return rec;
      });
      if (targetRec) postToCloudFast({ action: 'UPDATE_SINGLE_RECORD', record: targetRec }, next);
      return next;
    });`
        );
        tsxCode = tsxCode.replace(
          "setRecords(prev => prev.filter(rec => rec.id !== recordId));",
          "setRecords(prev => { const next = prev.filter(rec => rec.id !== recordId); postToCloudFast({ action: 'DELETE_SINGLE_RECORD', recordId }, next); return next; });"
        );

        // 4. KOMPRESI AUDIO REKAMAN (32 KBPS)
        tsxCode = tsxCode.replace(
          "const mediaRecorder = new MediaRecorder(stream);",
          "const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4' : ''); const mediaRecorder = mime ? new MediaRecorder(stream, { mimeType: mime, audioBitsPerSecond: 32000 }) : new MediaRecorder(stream);"
        );

        const oldBlobStop = `          if (audioChunksRef.current.length > 0) {
            const audioBlob = new Blob(audioChunksRef.current, { type: 'audio/webm' });
            const url = URL.createObjectURL(audioBlob);
            setRecordedAudioUrl(url);
          }`;
        const newBlobStop = `          if (audioChunksRef.current.length > 0) {
            const mimeType = MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : 'audio/mp4';
            const audioBlob = new Blob(audioChunksRef.current, { type: mimeType });
            const reader = new FileReader();
            reader.onloadend = () => {
              if (typeof reader.result === 'string') setRecordedAudioUrl(reader.result);
            };
            reader.readAsDataURL(audioBlob);
          }`;
        tsxCode = tsxCode.replace(oldBlobStop, newBlobStop);

        // 5. FITUR IMPORT MASSAL 1.000 MURID DARI EXCEL
        const oldStudentState = `  // State tambah murid baru
  const [newStudentName, setNewStudentName] = useState("");`;
        const newStudentState = `  // State tambah murid baru & Bulk Import Excel 1.000 Murid
  const [newStudentName, setNewStudentName] = useState("");
  const [bulkExcelText, setBulkExcelText] = useState("");
  const [showBulkModal, setShowBulkModal] = useState(false);

  const handleBulkImportStudents = (replaceExisting = false) => {
    const lines = bulkExcelText.split(/\\r?\\n/).map(l => l.trim()).filter(Boolean);
    if (lines.length === 0) {
      showToast("Tempelkan data dari Excel terlebih dahulu!", "error");
      return;
    }
    const startPwd = Number(draftConfig.studentPasswordStart) || 123456;
    const baseIdx = replaceExisting ? 0 : draftConfig.students.length;
    const parsedStudents = lines.map((line, idx) => {
      const parts = line.includes("\\t") ? line.split("\\t") : (line.includes(";") ? line.split(";") : line.split(","));
      const name = (parts[0] || "").trim().replace(/^["']|["']$/g, "");
      const kelas = (parts[1] || "VII-A").trim().replace(/^["']|["']$/g, "");
      const customPwd = (parts[2] || "").trim().replace(/^["']|["']$/g, "");
      const num = baseIdx + idx + 1;
      return {
        id: \`STD-\${String(num).padStart(3, '0')}-\${Math.random().toString(36).slice(2, 5)}\`,
        name: name || \`Murid \${num}\`,
        kelas: kelas || "VII-A",
        password: customPwd || String(startPwd + num - 1)
      };
    });
    setDraftConfig(prev => ({
      ...prev,
      students: replaceExisting ? parsedStudents : [...prev.students, ...parsedStudents]
    }));
    setBulkExcelText("");
    setShowBulkModal(false);
    showToast(\`Berhasil mengimpor \${parsedStudents.length} murid sekaligus! Jangan lupa klik Simpan Pengaturan Admin.\`);
  };`;
        tsxCode = tsxCode.replace(oldStudentState, newStudentState);

        const targetRangeBox = `                  {/* Form Tambah Murid Baru */}`;
        const injectedBulkImporter = `                  {/* FITUR IMPORT MASSAL 1.000 MURID DARI EXCEL / DAPODIK */}
                  <div className="bg-amber-50 border-2 border-amber-300 p-4 rounded-2xl space-y-3">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <div className="text-xs font-extrabold text-amber-950">⚡ Import Massal Ratusan / 1.000 Murid dari Microsoft Excel (Selesai 10 Detik)</div>
                        <div className="text-[11px] text-amber-800">
                          Salin (Copy) kolom <strong>Nama Murid</strong>, <strong>Kelas</strong>, dan <strong>Password/NISN (Opsional)</strong> langsung dari Excel, lalu tempelkan di sini.
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => setShowBulkModal(!showBulkModal)}
                        className="px-3.5 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 text-xs font-extrabold cursor-pointer shadow-xs"
                      >
                        {showBulkModal ? "Tutup Kotak Import Excel" : "📥 Buka Import Excel Massal"}
                      </button>
                    </div>

                    {showBulkModal && (
                      <div className="space-y-2.5 pt-2 border-t border-amber-200">
                        <textarea
                          rows={6}
                          value={bulkExcelText}
                          onChange={(e) => setBulkExcelText(e.target.value)}
                          placeholder={"Contoh hasil Copy-Paste dari Excel (atau pisahkan dengan koma):\\nAhmad Fauzan\\tVII-A\\t123456\\nAisyah Putri\\tVII-A\\t123457\\nBima Arya\\tVIII-B\\t123458"}
                          className="w-full rounded-xl border border-amber-300 p-3 text-xs font-mono bg-white text-slate-800"
                        />
                        <div className="flex flex-wrap gap-2 justify-end">
                          <button
                            type="button"
                            onClick={() => handleBulkImportStudents(false)}
                            className="px-4 py-2 rounded-xl bg-emerald-700 hover:bg-emerald-800 text-white text-xs font-bold cursor-pointer"
                          >
                            + Tambahkan ke Daftar Saat Ini
                          </button>
                          <button
                            type="button"
                            onClick={() => handleBulkImportStudents(true)}
                            className="px-4 py-2 rounded-xl bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold cursor-pointer"
                          >
                            🔄 Ganti Seluruh Daftar Murid Lama dengan Ini
                          </button>
                        </div>
                      </div>
                    )}
                  </div>

                  {/* Form Tambah Murid Baru */}`;

        tsxCode = tsxCode.replace(targetRangeBox, injectedBulkImporter);

        // 6. SAKLAR SEMBUNYIKAN BANTUAN PASSWORD DI TAB 1 ADMIN
        const targetAdminPinInput = `                      <div>
                        <label className="block text-xs font-bold text-slate-700 mb-1">PIN Halaman Database:</label>
                        <input
                          type="text"
                          value={draftConfig.databasePin}
                          onChange={(e) => setDraftConfig(prev => ({ ...prev, databasePin: e.target.value }))}
                          className="w-full rounded-xl border border-slate-300 px-3 py-2 text-xs font-mono font-bold bg-slate-50"
                        />
                      </div>
                    </div>`;

        const injectedToggleSwitch = targetAdminPinInput + `
                    <div className="mt-4 p-4 rounded-2xl border-2 border-amber-300 bg-amber-50/80 flex items-center justify-between gap-4">
                      <div>
                        <div className="text-xs font-extrabold text-amber-950">🔒 Sembunyikan Bantuan & Tombol "Isi Password Otomatis" (Mode Sekolah Resmi)</div>
                        <div className="text-[11px] text-amber-800 mt-0.5">
                          Aktifkan saklar ini saat aplikasi sudah dipakai murid agar tombol "Password (123456-123490)" dan "Isi Otomatis" disembunyikan.
                        </div>
                      </div>
                      <button
                        type="button"
                        onClick={() => setDraftConfig(prev => ({ ...prev, hidePasswordHints: !prev.hidePasswordHints }))}
                        className={\`px-3.5 py-2 rounded-xl text-xs font-extrabold shrink-0 cursor-pointer transition \${
                          draftConfig.hidePasswordHints ? 'bg-slate-900 text-amber-400' : 'bg-amber-500 text-slate-950'
                        }\`}
                      >
                        {draftConfig.hidePasswordHints ? '🔒 TERSEMBUNYI (MODE RESMI)' : '🔓 TAMPIL (MODE DEMO)'}
                      </button>
                    </div>`;

        tsxCode = tsxCode.replace(targetAdminPinInput, injectedToggleSwitch);

        tsxCode = tsxCode.replaceAll(
          'className="text-[11px] font-bold hover:underline cursor-pointer"',
          'className="text-[11px] font-bold hover:underline cursor-pointer demo-pwd-btn"'
        );
        tsxCode = tsxCode.replace(
          'onClick={() => setShowPasswordModal(true)}\n                className="flex items-center gap-1.5 px-3 py-2',
          'onClick={() => setShowPasswordModal(true)}\n                className="demo-pwd-btn flex items-center gap-1.5 px-3 py-2'
        );
        tsxCode = tsxCode.replace(
          'onClick={onOpenPasswordList}\n            style={{ color: \'var(--primary-color)\' }}\n            className="text-xs font-bold hover:underline cursor-pointer"',
          'onClick={onOpenPasswordList}\n            style={{ color: \'var(--primary-color)\' }}\n            className="demo-pwd-btn text-xs font-bold hover:underline cursor-pointer"'
        );

        try {
          const savedCfg = JSON.parse(localStorage.getItem("ETAHFIZ_WHITELABEL_CONFIG_V1") || "{}");
          if (savedCfg.hidePasswordHints) {
            document.body.classList.add('hide-password-hints');
          }
        } catch (e) {}

        const modifiedCode = tsxCode.replace('export default function App()', 'function App()') +
          '\nimport { createRoot } from "react-dom/client";\ncreateRoot(document.getElementById("root")).render(<App />);';

        const compiled = Babel.transform(modifiedCode, {
          presets: [
            ['react', { runtime: 'classic' }],
            'typescript'
          ],
          sourceType: 'module',
          filename: 'app.tsx'
        }).code;

        const blob = new Blob([compiled], { type: 'text/javascript' });
        const moduleUrl = URL.createObjectURL(blob);
        await import(moduleUrl);

      } catch (err) {
        document.getElementById('root').innerHTML = 
          '<div style="padding:24px;color:#be123c;font-family:monospace;background:#ffe4e6;margin:20px;border-radius:12px;">' +
          '<strong>Detail Kendala Teknis:</strong><br/>' + err.message + '</div>';
        console.error(err);
      }
    }

    bootRealtimeApp();
  </script>
</body>
</html>
