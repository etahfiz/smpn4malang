<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <!-- KODE SEO E-TAHFIZ SMPN 4 MALANG -->
  <title>E-Tahfiz & Tilawah Mujawwad Al-Qur'an - SMP Negeri 4 Malang</title>
  <meta name="description" content="Portal resmi E-Tahfiz dan Tilawah Mujawwad Al-Qur'an SMP Negeri 4 Malang (Jl. Veteran No. 37). Sistem terintegrasi perekaman setoran Juz 30 & Juz 29, penilaian guru, dan pemantauan orang tua." />
  <meta name="keywords" content="E-Tahfiz SMPN 4 Malang, Tilawah Mujawwad SMPN 4 Malang, Setoran Hafalan SMP Negeri 4 Malang, Arspema" />
  <meta name="robots" content="index, follow" />

  <!-- Tailwind CSS & Font -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>

  <!-- Mesin React 18 & Lucide Icons -->
  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@18.2.0",
        "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
        "lucide-react": "https://esm.sh/lucide-react@0.454.0?external=react"
      }
    }
  </script>

  <!-- Penerjemah Otomatis File .TSX (Babel) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-50">
  <!-- Indikator Loading Awal (Akan otomatis hilang saat aplikasi muncul) -->
  <div id="root">
    <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#065f46;font-weight:bold;">
      Memuat Portal E-Tahfiz & Tilawah SMPN 4 Malang...
    </div>
  </div>

  <!-- Memuat & Menjalankan File .TSX secara Otomatis -->
  <script type="module">
    async function loadApp() {
      try {
        const res = await fetch('./e_tahfiz_tilawah_smpn_4_malang.tsx');
        if (!res.ok) throw new Error('File .tsx tidak ditemukan (HTTP ' + res.status + ')');
        
        const tsxCode = await res.text();

        // Ubah 'export default function App()' menjadi 'function App()' dan tambahkan perender
        const modifiedCode = tsxCode.replace('export default function App()', 'function App()') +
          '\nimport { createRoot } from "react-dom/client";\ncreateRoot(document.getElementById("root")).render(<App />);';
        
        // PENTING: Gunakan modules: false pada preset env agar 'import' tidak diubah menjadi 'require()'
        const compiled = Babel.transform(modifiedCode, {
          presets: [
            ['env', { modules: false }],
            'react',
            'typescript'
          ],
          sourceType: 'module',
          filename: 'app.tsx'
        }).code;

        // Jalankan kode hasil terjemahan sebagai ES Module
        const blob = new Blob([compiled], { type: 'text/javascript' });
        const moduleUrl = URL.createObjectURL(blob);
        await import(moduleUrl);
      } catch (err) {
        document.getElementById('root').innerHTML = 
          '<div style="padding:24px;color:#be123c;font-family:monospace;background:#ffe4e6;margin:20px;border-radius:12px;">' +
          '<strong>Detail Kendala Teknis:</strong><br/>
